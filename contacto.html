<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contáctate con Gabriela Pino para proyectos de marketing digital, estrategias comerciales y experiencia de cliente.">
    <meta name="author" content="Gabriela Pino">
    <title>Contacto - Gabriela Pino</title>
    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Tipografía Outfit desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="light-theme">

    <!-- CONTENEDOR PRINCIPAL TIPO TARJETA (MAIN) -->
    <main class="card card-contact">

        <!-- ENCABEZADO: NAVEGACIÓN Y TÍTULOS -->
        <header class="card-contact-header">
            <!-- MENÚ DE NAVEGACIÓN SUPERIOR -->
            <nav aria-label="Navegación principal">
                <a href="index.html">Inicio</a>
                <a href="proyectos.html">Proyectos</a>
                <a href="contacto.html" class="active" aria-current="page">Contacto</a>
            </nav>

            <!-- ENCABEZADO DE LA SECCIÓN CONTACTO -->
            <div class="contact-header">
                <h1 class="contact-title">Contacto</h1>
                <div class="accent-line" role="separator" aria-hidden="true"></div>
                <p class="contact-subtitle">
                    ¿Tienes un proyecto en mente?<br>
                    ¡Hablemos! Completa el formulario y me pondré en contacto contigo.
                </p>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL: FORMULARIO A LA IZQUIERDA + ILUSTRACIÓN Y DATOS A LA DERECHA -->
        <div class="contact-grid">

            <!-- COLUMNA IZQUIERDA: FORMULARIO SEMÁNTICO -->
            <form class="contact-form" action="#" method="POST" aria-label="Formulario de contacto">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Cuéntame sobre tu proyecto..."
                        required></textarea>
                </div>

                <button type="submit" class="btn-send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span>Enviar mensaje</span>
                </button>
            </form>

            <!-- COLUMNA DERECHA: ASIDE CON ILUSTRACIÓN Y DATOS DE CONTACTO DIRECTO -->
            <aside class="contact-sidebar" aria-label="Información de contacto directo">
                <figure class="contact-illustration">
                    <img src="img/contacto-ilustracion.jpg" alt="Ilustración 3D de sobre con carta y avión de papel">
                </figure>

                <div class="direct-contact-card">
                    <div class="direct-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                    <div class="direct-info">
                        <span class="direct-label">También puedes escribirme a:</span>
                        <a href="mailto:gabriela.a.pino.lillo14@gmail.com" class="direct-email">gabriela.a.pino.lillo14@gmail.com</a>
                        <span class="direct-note">Responderé a la brevedad posible.</span>
                    </div>
                </div>
            </aside>

        </div>

        <!-- PIE DE PÁGINA SEMÁNTICO (FOOTER) -->
        <footer class="contact-footer">
            <p><small>© 2026 Gabriela Pino · Portafolio Profesional</small></p>
        </footer>

    </main>

    <!-- INTERACTIVIDAD: MOVIMIENTO DE LA CARTA Y ENVÍO DEL FORMULARIO -->
    <script>
        // Movimiento interactivo 3D de la carta con el cursor del ratón
        const cardIllustration = document.querySelector('.contact-illustration');
        if (cardIllustration) {
            cardIllustration.addEventListener('mousemove', (e) => {
                const rect = cardIllustration.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                const rotateX = -(y / (rect.height / 2)) * 14;
                const rotateY = (x / (rect.width / 2)) * 14;
                cardIllustration.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px) scale(1.04)`;
            });

            cardIllustration.addEventListener('mouseleave', () => {
                cardIllustration.style.transform = '';
            });
        }

        // Confirmación amigable al enviar el formulario
        const contactForm = document.querySelector('.contact-form');
        if (contactForm) {
            contactForm.addEventListener('submit', function (e) {
                e.preventDefault();
                alert('¡Gracias por comunicarte! Responderé a tu mensaje a la brevedad posible.');
                this.reset();
            });
        }
    </script>

</body>

</html>
